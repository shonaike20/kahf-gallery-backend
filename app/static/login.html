<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>KAHF ADMIN — Login</title>
  <style>
    :root {
      --bg: #f4efe9;
      --card: #ffffff;
      --text: #2f2f2f;
      --muted: #7a7a7a;
      --accent: #b89b7c;
      --border: #e2d9cf;
      --danger: #b14d4d;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--text);
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="password"] {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text);
      background: #faf7f3;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 0.5px;
      transition: opacity 0.15s;
    }

    .btn:hover {
      opacity: 0.88;
    }

    .error {
      background: #fdf0f0;
      border: 1px solid #f0c8c8;
      color: var(--danger);
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">
        <img src="/static/kahf-logo.png" alt="KAHF Logo">
      </div>
      <h1>KAHF ADMIN</h1>
      <div class="subtitle">Sign in to continue</div>
    </div>

    <div id="errorMsg" class="error" style="display:none">
      Invalid username or password.
    </div>

    <form method="POST" action="/login">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>
  </div>

  <script>
    // Show error if redirected back with ?error=1
    if (new URLSearchParams(location.search).get("error")) {
      document.getElementById("errorMsg").style.display = "block";
    }
  </script>
</body>
</html>
